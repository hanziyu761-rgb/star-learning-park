# Real-phone check for the AI 少年学院 Android app: builds a test copy of the
# app (same content, with WebView inspection switched on so the test can drive
# it), runs it on Android emulators, and keeps screenshots + results as a
# downloadable artifact of the run. It does not publish or release anything.
name: academy-apk-device-test
on:
  push:
    branches: [feature/academy-apk]
    paths: ['academy/**', 'academy-android/**', '.github/workflows/academy-apk-device-test.yml']
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [34, 29]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build test APK
        working-directory: academy-android
        run: |
          npm ci
          npm run web
          npx cap sync android
          sed -i 's/"webContentsDebuggingEnabled": false/"webContentsDebuggingEnabled": true/' android/app/src/main/assets/capacitor.config.json
          cd android && ./gradlew assembleDebug --no-daemon -q
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install test tool
        run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.56.1
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p results/api-${{ matrix.api }}
            adb install -r academy-android/android/app/build/outputs/apk/debug/app-debug.apk
            NODE_PATH=/tmp/pw/node_modules node academy-android/device-test/check.cjs results/api-${{ matrix.api }} || echo "FAILED" > results/api-${{ matrix.api }}/FAILED
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-api-${{ matrix.api }}, path: results }
